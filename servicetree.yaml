service: scoop-razorpay-cli  # required, canonical slug — immutable once registered
displayName: "Scoop Bucket for Razorpay CLI"  # required, human-readable name — README H1 "# Scoop Bucket for Razorpay CLI"
description: "Official Scoop bucket (Windows package manifest) for the Razorpay CLI, letting Windows developers install and update the `razorpay` binary via `scoop install razorpay/razorpay`."  # required, one-sentence description — README installation section; the repo holds a single razorpay.json manifest alongside the README
type: library  # required, one of: service | worker | cron | library | pipeline — a two-file package-manager manifest repo (README.md + razorpay.json) fed by the razorpay-cli release workflow; nothing runs anywhere · retype after the serviceTypes enum widens: tool
tier: T3  # required, one of: T0 | T1 | T2 | T3 — a packaging/distribution shim for the CLI (whose own manifest, razorpay-cli, carries the T2 rating for the shipped artifact); the bucket itself is a pointer file, so T3 — a stale manifest is an inconvenience, not an outage
lifecycle: live  # optional — current and referenced by the razorpay-cli release automation (the merged razorpay-cli manifest names this repo as the CLI's Scoop bucket); last push 2026-07-15 is normal cadence for a manifest bumped per release

domain: razorpay1/developer-experience  # required, two-level domain/subgroup slug — family razorpay1 from cache/miss_seed.json l1 (BU "SME Payments"); area reuses the razorpay1/developer-experience slug already created for the merged razorpay-cli manifest, keeping the CLI and its distribution bucket together

owner:
  team:  # required, owning team slug — TO FILL: this repo has no CODEOWNERS file, .github/repo_owners.json carries no team slug, and the GitHub repository-teams API is not readable with the current token; ask the POD lead for the owning GitHub team
  em:  # name | @slack | email — TO FILL: DevRev runnable owner not found in SuccessFactors
  org_group:  # SuccessFactors group of the EM — TO FILL: the declared owner has no SuccessFactors record, so the org tree cannot be resolved; ask the POD lead
  org_sub_group:  # SuccessFactors sub-group of the EM — TO FILL: the declared owner has no SuccessFactors record; ask the POD lead
  org_pod:  # SuccessFactors pod of the EM — TO FILL: the declared owner has no SuccessFactors record; ask the POD lead
  pm:  # product manager — TO FILL: not derived on purpose; ask the razorpay-cli owners
  overrides: []  # optional, region-scoped owner overrides — TO FILL only if some region is owned by a different team; each entry is a "region" code plus the owning "team" slug

